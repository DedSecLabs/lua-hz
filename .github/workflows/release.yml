name: Draft release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - tools/package_release.py
      - manifests/release.json
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/package_release.py
      - manifests/release.json
      - tests/package_release_spec.py

permissions:
  contents: read

concurrency:
  group: draft-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Developer tools
        run: sudo apt-get update && sudo apt-get install -y luajit gcc binutils-mingw-w64-i686 mingw-w64-i686-dev
      - run: python -m pip install -r requirements-dev.txt
      - name: Source and packaging checks
        run: python tools/check.py --luajit /usr/bin/luajit
      - run: python tools/build_native_visuals.py --toolchain /usr
      - name: Native loading build
        run: |
          fingerprint=$(python -c 'import json; print(json.load(open("manifests/dependencies.json"))["native_loading_artifact"]["resource_fnv32"])')
          python tools/build_native_loading.py --toolchain /usr --asset-fnv "$fingerprint"
      - name: Package developer preview
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: python tools/package_release.py --output dist/release --native-dir build/native --revision "$SOURCE_REVISION"
      - name: Verify checksums
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-preview
          path: dist/release/
          if-no-files-found: error
          retention-days: 30

  draft:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-preview
          path: dist/release
      - name: Verify downloaded artifacts
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS.txt
      - name: Create or update draft preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          tag=$(python3 -c 'import json; print(json.load(open("dist/release/release-manifest.json"))["tag"])')
          version=$(python3 -c 'import json; print(json.load(open("dist/release/release-manifest.json"))["version"])')
          if gh release view "$tag" --json isDraft --jq .isDraft > draft-state.txt; then
            if [ "$(cat draft-state.txt)" != true ]; then
              echo "Refusing to change a published release. Use a new version."
              exit 1
            fi
            gh release edit "$tag" --draft --prerelease --latest=false --target "$SOURCE_REVISION" \
              --title "LuaHZ $version — developer preview" --notes-file dist/release/RELEASE_NOTES.md
            gh release upload "$tag" dist/release/*.zip dist/release/SHA256SUMS.txt \
              dist/release/release-manifest.json dist/release/RELEASE_NOTES.md --clobber
          else
            gh release create "$tag" dist/release/*.zip dist/release/SHA256SUMS.txt \
              dist/release/release-manifest.json dist/release/RELEASE_NOTES.md --draft --prerelease --latest=false \
              --target "$SOURCE_REVISION" --title "LuaHZ $version — developer preview" \
              --notes-file dist/release/RELEASE_NOTES.md
          fi
          gh release view "$tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

name: Player release candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - player-resources/**
      - src/**
      - manifests/release.json
      - tools/package_player.py
      - tools/package_base.py
      - tools/base_install.sh
      - tools/base_restore.sh
      - tools/base_install.ps1
      - tools/base_restore.ps1
      - docs/releases/**
      - .github/workflows/player-release.yml

permissions:
  contents: read

concurrency:
  group: linux-player-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Developer tools
        run: sudo apt-get update && sudo apt-get install -y luajit gcc
      - run: python -m pip install -r requirements-dev.txt
      - name: Source and recovery checks
        run: python tools/check.py --luajit /usr/bin/luajit
      - name: Package Linux player download
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: python tools/package_player.py --output dist/player --revision "$SOURCE_REVISION" --resources player-resources --asi player-resources/LuaHZLoading.asi
      - name: Verify ZIP
        working-directory: dist/player
        run: sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-player-release
          path: |
            dist/player/*.zip
            dist/player/SHA256SUMS.txt
            dist/player/RELEASE_NOTES.md
            dist/player/release-manifest.json
          if-no-files-found: error

  release:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: linux-player-release
          path: dist/player
      - name: Prepare draft player release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          cd dist/player
          sha256sum --check SHA256SUMS.txt
          tag=$(python3 -c 'import json; print(json.load(open("release-manifest.json"))["tag"])')
          version=$(python3 -c 'import json; print(json.load(open("release-manifest.json"))["version"])')
          if gh release view "$tag" --json isDraft --jq .isDraft > is-draft.txt; then
            if [ "$(cat is-draft.txt)" != true ]; then
              echo 'Published release preserved. Use a new version for changed bytes.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            gh release upload "$tag" ./*.zip SHA256SUMS.txt RELEASE_NOTES.md release-manifest.json --clobber
            gh release edit "$tag" --draft --prerelease --latest=false --target "$SOURCE_REVISION" \
              --title "LuaHZ $version — player release" --notes-file RELEASE_NOTES.md
            echo 'Draft refreshed. Owner testing is required before publication.' >> "$GITHUB_STEP_SUMMARY"
            gh release view "$tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$tag" ./*.zip SHA256SUMS.txt RELEASE_NOTES.md release-manifest.json \
            --draft --prerelease --latest=false --target "$SOURCE_REVISION" \
            --title "LuaHZ $version — player release" --notes-file RELEASE_NOTES.md
          gh release view "$tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
